# Convert whatever is in work-source/ into the two sizes the site serves.
#
# This is what makes "drag a file onto GitHub" enough to update the portfolio.
# Push to work-source/, and a few minutes later the pieces are on the site:
# this job converts them, commits the results, and Vercel redeploys off that
# commit. Nobody has to run anything locally or hold a credential.
#
# It runs on push rather than on a schedule so the feedback is immediate, and
# it can always be run by hand from the Actions tab if something needs redoing.
name: Work

on:
  push:
    branches: [main]
    paths:
      - 'work-source/**'
      - 'scripts/work.mjs'
      - '.github/workflows/work.yml'
  workflow_dispatch:

# Two uploads a minute apart must not race each other into the same commit.
concurrency:
  group: work-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      # The job commits the converted images back to the branch.
      contents: write

    steps:
      - uses: actions/checkout@v5

      # pdftoppm, for PDFs. Most of what a design studio hands over is a PDF,
      # so without this the pipeline would refuse most of the portfolio.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Convert
        id: convert
        run: |
          set -o pipefail
          SRC=work-source ./scripts/work.sh 2>&1 | tee /tmp/work.log

      - name: Commit the converted work
        id: commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/work src/lib/file47-work.generated.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo 'Nothing changed — the converted work already matches the sources.'
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m 'Work: convert the supplied files' \
                     -m 'Generated by .github/workflows/work.yml from work-source/.'
          git push

      # Everything the run did, on the run's own page: what was made, what was
      # left out and why, and which pieces are still showing a filename instead
      # of a name. A log nobody reads is not a report.
      - name: Report
        if: always()
        run: |
          {
            echo '## Work'
            if [ '${{ steps.commit.outputs.changed }}' = 'true' ]; then
              echo 'Committed. Vercel is deploying the site now.'
            else
              echo 'No change — the site already matches `work-source/`.'
            fi
            echo
            echo '<details><summary>What the conversion did</summary>'
            echo
            echo '```'
            tail -c 60000 /tmp/work.log || echo '(no log)'
            echo '```'
            echo
            echo '</details>'
            echo
            node scripts/unnamed.mjs || true
          } >> "$GITHUB_STEP_SUMMARY"
